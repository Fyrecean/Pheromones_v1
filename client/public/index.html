<!DOCTYPE html>
<html>
    <head>
        <title>Pheromones Simulation</title>
        <link rel="icon" type="image/x-icon" href="favicon.ico">
        <link href="style.css" rel="stylesheet"></link>
    </head>
    <body>
        <div id="config">
            <div id="buttons">    
                <button id="pause">Pause Sim</button>
                <button id="reset">Reset Sim</button>
                <select style="width: 10rem;" id=savedConfigs>
                    <option>Default</option>
                    <option>+Create New</option>
                </select>
                <button id="show">Show Config</button>
            </div>
        </div>
        <div id="configFlyout">
            <div style="display: flex; justify-content: flex-end;">
                <input width="20rem" id="configName" type="text" placeholder="Config name">
                <button id="saveConfig">Save</button>
            </div>
            <table id="configTable"></table>
        </div>
        <div id="canvasDiv">
            <canvas width="512" height="512"></canvas>
        </div>
    </body>
    <script src="bundle.js"></script>
</html>
