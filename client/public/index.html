<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Pheromones Simulation</title>
        <link rel="icon" type="image/x-icon" href="favicon.ico">
        <link href="style.css" rel="stylesheet"></link>
    </head>
    <body>
        <div id="config">
            <div id="buttons">    
                <button id="pause">Pause Sim</button>
                <button id="reset">Reset Sim</button>
                <select title="Config Options" style="width: 10rem;" id=savedConfigs>
                    <option>Default</option>
                </select>
                <button type="button" id="show">Show Config</button>
            </div>
        </div>
        <div id="configFlyout">
            <div style="display: flex; justify-content: flex-end;">
                <label for="configName">Config Name</label>
                <input disabled style="margin-left: .5rem; width: 8rem;" id="configName" type="text" placeholder="Default">
                <button disabled type="button" id="saveConfig">Save</button>
            </div>
            <table id="configTable"></table>
        </div>
        <div id="canvasDiv">
            <canvas width="512" height="512"></canvas>
        </div>
    </body>
    <script src="bundle.js"></script>
</html>
